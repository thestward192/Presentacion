<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Presentación del módulo Talent Acquisition: pre-screening de candidatos con un servidor MCP, con demos que reproducen ejecuciones reales." />
    <title>Pre-Screening con MCP</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar un destello.
      try {
        var t = localStorage.getItem('ta-presentacion-tema');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Presentación para público general: siempre en vista simple.
      document.documentElement.dataset.view = 'simple';
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="ambient" aria-hidden="true"><i class="orb orb-a"></i><i class="orb orb-b"></i><i class="orb orb-c"></i></div>
    <header class="nav">
      <div class="nav-inner">
        <span class="nav-brand">Talent Acquisition <span>MCP</span></span>
        <nav class="page-tabs" role="tablist" aria-label="Páginas"></nav>
        <div class="nav-actions">
          <button class="theme-toggle" type="button" aria-pressed="false" title="Cambiar tema (T)">
            <span class="theme-icon" aria-hidden="true"></span>
            <span class="theme-label">Claro</span>
          </button>
        </div>
      </div>
    </header>
    <main id="contenido" class="deck">
      <div class="loading" role="status">Cargando…</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
